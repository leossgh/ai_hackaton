[project]
name = "foundry-assistant"
version = "0.1.0"
description = "The Apheris Foundry docs assistant in a terminal: an on-prem decision model routes the docs, a small local model writes the answer."
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "rich>=13",
]

[project.scripts]
foundry-ask = "foundry_assistant.cli:main"
foundry-assistant-kb = "foundry_assistant.docs_to_kb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_assistant"]
